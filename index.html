  <style>
    /* --- CSS STYLES --- */
    *{box-sizing:border-box}
    :root{--pink:#ff6fae;--hot:#f84d93;--soft:#fff3f8;--ink:#463744;--white:#fff;--shadow:0 18px 45px rgba(207,83,139,.16)}
    html,body{margin:0;min-height:100%;font-family:"Baloo 2",system-ui,sans-serif;color:var(--ink);overflow-x:hidden}
    body{background:linear-gradient(180deg,#ffd8e8 0%,#fff0f7 55%,#fdf8ff 100%)}
    .sky{position:fixed;inset:0;z-index:-2;overflow:hidden;background:linear-gradient(180deg,#ffd2e5,#fff0f7 55%,#f8f4ff)}
    .cloud{position:absolute;width:260px;height:75px;background:rgba(255,255,255,.45);border-radius:100px;filter:blur(1px);animation: floatCloud 8s ease-in-out infinite alternate;}
    @keyframes floatCloud { 0% { transform: translateY(0px); } 100% { transform: translateY(-12px); } }
    .cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}
    .cloud:before{width:110px;height:110px;left:40px;top:-45px}.cloud:after{width:140px;height:140px;right:30px;top:-65px}
    .cloud-1{top:18%;left:-100px;animation-delay: 0s;}
    .cloud-2{top:62%;right:-110px;transform:scale(.85);animation-delay: 2s;}
    .cloud-3{top:82%;left:10%;transform:scale(.55);opacity:.7;animation-delay: 4s;}
    .stars:before,.stars:after{content:"✦  ·  ✧     ·  ✦       ·  ✧   ·";position:absolute;color:rgba(255,255,255,.85);font-size:25px;letter-spacing:20px;top:12%;left:8%}
    .stars:after{top:47%;left:72%;font-size:18px}
    .hearts-bg{position:absolute;inset:0;pointer-events:none}
    .float-heart{position:absolute;animation:floatUp linear forwards;opacity:.6}
    @keyframes floatUp{from{transform:translateY(20px) scale(.8);opacity:0}20%{opacity:.7}to{transform:translateY(-110vh) scale(1.25) rotate(18deg);opacity:0}}
    .app{width:min(980px,92vw);margin:auto;padding:28px 0 60px}
    .hero{text-align:center;position:relative}
    .top-pill,.date-pill{position:absolute;top:0;background:rgba(255,255,255,.68);border:1px solid rgba(255,255,255,.8);padding:9px 18px;border-radius:999px;box-shadow:0 8px 25px rgba(211,89,139,.1);font-weight:700;color:#ee4f92}
    .top-pill{left:0}.date-pill{right:0; cursor:pointer; font-family:inherit; transition: transform 0.2s;}
    .date-pill:hover{transform: scale(1.05); background: rgba(255,255,255,.9);}
    .small-title{margin:62px 0 0;font-size:18px}.hero h1{font-family:Pacifico,cursive;color:#f44e95;font-size:clamp(54px,10vw,92px);line-height:1;margin:6px 0;text-shadow:0 5px 0 rgba(255,255,255,.8)}
    .nickname{display:inline-block;background:#ff6fae;color:#fff;padding:5px 30px;border-radius:12px;transform:rotate(-1deg);font-weight:700;font-size:20px}
    .intro{margin:24px auto 28px;max-width:650px;font-size:20px;line-height:1.45}.intro span{color:#f14f94;font-weight:700}
    .gifts{display:grid;grid-template-columns:repeat(3,1fr);gap:25px;margin-top:28px}
    .gift-card{border:0;background:rgba(255,255,255,.66);border:1px solid rgba(255,255,255,.9);border-radius:28px;padding:24px 14px 18px;box-shadow:var(--shadow);cursor:pointer;color:var(--ink);font-family:inherit;transition:.25s}
    .gift-card:hover{transform:translateY(-8px) rotate(-1deg);box-shadow:0 24px 55px rgba(207,83,139,.22)}
    .gift-card.opened{background:rgba(255,255,255,.88);outline:2px solid #ff9bc3}
    .gift-card strong{display:block;color:#ef5797;font-size:19px}.gift-card small{display:block;margin-top:3px;color:#8f7584}
    .gift-box{height:170px;position:relative;width:180px;margin:auto;filter:drop-drop-shadow(0 13px 10px rgba(201,66,126,.17))}
    .gift-box .box{position:absolute;left:20px;right:20px;bottom:10px;height:105px;border-radius:8px 8px 15px 15px;background:linear-gradient(90deg,#ff72ad,#ff9ac5 50%,#ff65a4)}
    .gift-box .lid{position:absolute;left:12px;right:12px;top:45px;height:38px;border-radius:10px;background:linear-gradient(90deg,#ff5e9e,#ff98c4);z-index:2}
    .ribbon{position:absolute;z-index:3;width:28px;height:105px;left:76px;bottom:10px;background:#ffb2d0;border-radius:3px}
    .bow{position:absolute;z-index:4;top:3px;left:53px;font-size:75px;transform:rotate(-7deg)}
    .lock{position:absolute;z-index:5;left:72px;top:72px;width:38px;height:38px;background:#fff;border-radius:50%;display:grid;place-items:center;color:#f65c9c;font-size:23px}
    .mini-game-section { margin: 35px auto 0; max-width: 700px; }
    .game-card-box { background: rgba(255,255,255,.75); border: 1px solid rgba(255,255,255,.9); border-radius: 28px; padding: 24px; text-align: center; box-shadow: var(--shadow); }
    .game-card-box h2 { font-family: Pacifico, cursive; color: #ef5797; font-size: 26px; margin: 0 0 6px 0; }
    .game-sub { color: #8f7584; margin-bottom: 20px; font-size: 16px; }
    .game-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; max-width: 480px; margin: 0 auto 15px; }
    .game-tile { background: linear-gradient(135deg, #ff8ebc, #ff6fae); border: none; border-radius: 16px; aspect-ratio: 1; font-size: 32px; cursor: pointer; box-shadow: 0 8px 20px rgba(207,83,139,0.2); transition: transform 0.2s, background 0.2s; display: grid; place-items: center; color: #fff; font-weight: 700; }
    .game-tile:hover { transform: scale(1.05); }
    .game-tile.revealed { background: #fff; border: 2px solid #ff9bc3; box-shadow: none; }
    .game-status { font-weight: 700; color: #d65b91; font-size: 17px; margin: 0; }
    .progress-wrap{max-width:530px;margin:35px auto 0;text-align:center}.progress-text{font-weight:700;color:#d65b91}.progress{height:9px;background:rgba(255,255,255,.7);border-radius:20px;margin-top:9px;overflow:hidden}.progress span{display:block;width:0;height:100%;background:linear-gradient(90deg,#ff79b2,#f24b91);border-radius:20px;transition:.5s}
    .message-panel{margin:30px auto 0;max-width:700px;text-align:center;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.9);padding:22px;border-radius:25px;box-shadow:var(--shadow)}.panel-heart{font-size:28px;color:#f35a9b}.message-panel p{font-size:20px;margin:4px}.message-panel small{color:#8b7583}
    .modal,.final-screen{position:fixed;inset:0;background:rgba(79,38,61,.3);backdrop-filter:blur(7px);z-index:20;display:none;align-items:center;justify-content:center;padding:20px}.modal.show,.final-screen.show{display:flex}
    .modal-card{position:relative;width:min(720px,95vw);max-height:90vh;overflow:auto;background:linear-gradient(180deg,#fffafd,#fff1f7);border:2px solid #fff;border-radius:30px;padding:34px;box-shadow:0 30px 80px rgba(91,38,68,.25);text-align:center}
    .close{position:absolute;right:15px;top:12px;border:0;background:#fff;color:#ee5796;width:38px;height:38px;border-radius:50%;font-size:28px;cursor:pointer}.modal-icon{font-size:48px}.modal h2{font-family:Pacifico,cursive;color:#ef5797;font-size:38px;margin:4px 0}.modal-sub{margin-top:0;color:#896e7e}
    .letter{font-size:19px;line-height:1.55;text-align:center;padding:12px 20px}.letter p{margin:14px 0}.letter b{color:#e94e91}
